<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tcbfp</title>
<style>
  :root { color-scheme: dark }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 14px;
    background: #0b0d10;
    color: #c9d1d9;
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  canvas { border: 1px solid #21262d; max-width: 92vw; touch-action: none }
  #t { font-size: 14px; color: #6e7681 }
  #t b { color: #f0f6fc; font-weight: 600; letter-spacing: .04em }
  #s { color: #6e7681 }
  a { color: #6e7681 }
  #n { max-width: 62ch; margin: 0 18px; text-align: center; line-height: 1.6; color: #6e7681 }
</style>
</head>
<body>
<canvas id="c" width="720" height="360"></canvas>
<div id="t">rejected from emergent ventures <b>0d 00:00:00.000000000</b> ago</div>
<div id="s">up or down to start</div>
<a href="https://github.com/ranveerlabs/excess/blob/main/tcbfp/pong.bf">pong.bf</a>
<p id="n">Note: Brainfuck is widely considered one of the hardest programming languages in existence. However, 14-year-olds named Ranveer Gill who have been rejected by Emergent Ventures find it surprisingly easy.</p>
<script>
const REJECTED = new Date('2026-09-02T09:34:00')
const WALL = Date.now()
const PERF = performance.now()
const W = 24
const H = 12

const cv = document.getElementById('c')
const cx = cv.getContext('2d')
const status = document.getElementById('s')
const face = new Image()
face.src = 'tyler.png'

let key = 0
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w') key = 1
  else if (e.key === 'ArrowDown' || e.key === 's') key = 2
  else return
  e.preventDefault()
})
addEventListener('keyup', () => { key = 0 })
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect()
  key = e.clientY - r.top < r.height / 2 ? 1 : 2
})
addEventListener('pointerup', () => { key = 0 })

function machine(src) {
  const jump = new Int32Array(src.length)
  const st = []
  for (let i = 0; i < src.length; i++) {
    if (src[i] === '[') st.push(i)
    else if (src[i] === ']') { const j = st.pop(); jump[i] = j; jump[j] = i }
  }
  const mem = new Uint8Array(30000)
  let ptr = 0
  let i = 0
  let buf = ''
  let started = false
  return (input) => {
    if (i >= src.length) return null
    if (started) mem[ptr] = input
    while (i < src.length) {
      const c = src[i]
      if (c === '>') ptr++
      else if (c === '<') ptr--
      else if (c === '+') mem[ptr]++
      else if (c === '-') mem[ptr]--
      else if (c === '.') buf += String.fromCharCode(mem[ptr])
      else if (c === ',') {
        i++
        started = true
        const f = buf
        buf = ''
        return f
      }
      else if (c === '[' && !mem[ptr]) i = jump[i]
      else if (c === ']' && mem[ptr]) i = jump[i]
      i++
    }
    return null
  }
}

function parse(frame) {
  const rows = frame.split('\n')
  const y = rows.findIndex((r) => r.includes('O'))
  const you = []
  const cpu = []
  rows.forEach((r, n) => {
    if (r.includes(']')) you.push(n)
    if (r.startsWith('[')) cpu.push(n)
  })
  return { bx: y === -1 ? -1 : rows[y].indexOf('O'), by: y, you, cpu }
}

function draw(s, alpha = 1) {
  const cw = cv.width / W
  const ch = cv.height / H
  cx.globalAlpha = 1
  cx.fillStyle = '#0b0d10'
  cx.fillRect(0, 0, cv.width, cv.height)
  const d = Math.min(cw, ch) * 1.55
  const reachL = cw + cw / 2 - d / 2
  const reachR = (W - 2) * cw + cw / 2 + d / 2
  if (s.by !== -1) {
    const bx = s.bx * cw + cw / 2
    const by = s.by * ch + ch / 2
    cx.globalAlpha = alpha
    if (face.complete && face.naturalWidth) {
      cx.save()
      cx.beginPath()
      cx.arc(bx, by, d / 2, 0, Math.PI * 2)
      cx.clip()
      cx.drawImage(face, bx - d / 2, by - d / 2, d, d)
      cx.restore()
    } else {
      cx.fillStyle = '#f0f6fc'
      cx.beginPath()
      cx.arc(bx, by, d / 2, 0, Math.PI * 2)
      cx.fill()
    }
    cx.globalAlpha = 1
  }
  cx.fillStyle = '#30363d'
  for (const n of s.cpu) cx.fillRect(reachL - 8, n * ch + 2, 8, ch - 4)
  for (const n of s.you) cx.fillRect(reachR, n * ch + 2, 8, ch - 4)
}

const el = document.querySelector('#t b')
function clock() {
  const ms = WALL + (performance.now() - PERF) - REJECTED.getTime()
  const s = Math.floor(ms / 1000)
  const frac = String(Math.floor((ms % 1000) * 1e6)).padStart(9, '0').slice(0, 9)
  const hh = String(Math.floor(s / 3600) % 24).padStart(2, '0')
  const mm = String(Math.floor(s / 60) % 60).padStart(2, '0')
  const ss = String(s % 60).padStart(2, '0')
  el.textContent = `${Math.floor(s / 86400)}d ${hh}:${mm}:${ss}.${frac}`
  requestAnimationFrame(clock)
}
clock()

fetch('pong.bf').then((r) => r.text()).then((src) => {
  let step
  let rallies
  let last
  let live
  const tick = () => {
    if (!live) {
      if (!key) return setTimeout(tick, 50)
      live = true
      status.textContent = 'up / down'
    }
    const frame = step(key)
    if (frame === null) {
      if (last && last.bx < W + 2) {
        last = { ...last, bx: last.bx + 1 }
        draw(last, Math.max(0, 1 - (last.bx - (W - 2)) / 4))
        return setTimeout(tick, 90)
      }
      status.textContent = `missed after ${rallies}. press any key`
      addEventListener('keydown', restart, { once: true })
      cv.addEventListener('pointerdown', restart, { once: true })
      return
    }
    const s = parse(frame)
    if (last && s.bx < last.bx && last.bx === W - 2) rallies++
    last = s
    draw(s)
    setTimeout(tick, 155)
  }
  const restart = () => {
    step = machine(src)
    rallies = 0
    last = null
    live = false
    status.textContent = 'up or down to start'
    draw(parse(step(0)))
    tick()
  }
  restart()
})
</script>
</body>
</html>
